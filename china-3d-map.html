<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D中国地图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        
        .control-item {
            margin: 5px 0;
            font-size: 12px;
        }
        
        .control-item label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .control-item input[type="range"] {
            width: 150px;
            margin: 5px 0;
        }
        
        button {
            background: rgba(0, 123, 255, 0.8);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin: 2px;
        }
        
        button:hover {
            background: rgba(0, 123, 255, 1);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>正在加载3D中国地图...</div>
        </div>
        
        <div id="info" style="display: none;">
            <div>Three.js 3D中国地图</div>
            <div>鼠标拖拽: 旋转视角</div>
            <div>滚轮: 缩放</div>
            <div>点击省份: 查看详情</div>
        </div>
        
        <div id="controls" style="display: none;">
            <div class="control-item">
                <button onclick="resetCamera()">重置视角</button>
                <button onclick="toggleWireframe()">切换线框</button>
            </div>
            <div class="control-item">
                <button onclick="changeColorScheme()">换色</button>
                <button onclick="toggleLabels()">显示/隐藏标签</button>
            </div>
            <div class="control-item">
                <button onclick="toggleTexture()">切换贴图</button>
                <button onclick="regenerateTexture()">重新生成纹理</button>
            </div>
            <div class="control-item">
                <button onclick="toggleAnimation()">开启/关闭动画</button>
            </div>
        </div>
    </div>

    <!-- Three.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

    <script>
        // 全局变量
        let scene, camera, renderer, controls;
        let chinaGroup, provinces = [];
        let raycaster, mouse;
        let isAnimating = true; // 启用动画
        let wireframeMode = false;
        let colorSchemeIndex = 0;
        let font;
        let chinaTexture; // 中国贴图纹理
        let animationTime = 0; // 动画时间
        
        // 颜色方案 - 更接近效果图的蓝色调
        const colorSchemes = [
            { 
                primary: 0x1a2f4f, 
                secondary: 0x2a4f7f, 
                glow: 0x00aaff,
                border: 0x00ccff,
                emission: 0x1a3f6f
            },
            { 
                primary: 0x1e4a2d, 
                secondary: 0x2e6a4d, 
                glow: 0x00ff88,
                border: 0x00ffaa,
                emission: 0x1e5a3d
            },
            { 
                primary: 0x4a1e4a, 
                secondary: 0x6a2e6a, 
                glow: 0xff00ff,
                border: 0xff44ff,
                emission: 0x5a1e5a
            },
            { 
                primary: 0x4a1e1e, 
                secondary: 0x6a2e2e, 
                glow: 0xff4444,
                border: 0xff6666,
                emission: 0x5a1e1e
            }
        ];
        
        
        
        // 初始化函数
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            
            // 创建渐变背景
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 512;
            
            const gradient = context.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, '#001122');
            gradient.addColorStop(0.5, '#002244');
            gradient.addColorStop(1, '#000511');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 512, 512);
            
            const backgroundTexture = new THREE.CanvasTexture(canvas);
            scene.background = backgroundTexture;
            
            // 添加雾效果
            scene.fog = new THREE.Fog(0x000511, 50, 200);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                45, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true,
                logarithmicDepthBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            
            document.getElementById('container').appendChild(renderer.domElement);
            
            // 创建中国贴图
            chinaTexture = createChinaTexture();
            
            // 创建控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.minDistance = 20;
            controls.maxDistance = 150;
            controls.maxPolarAngle = Math.PI * 0.8;
            controls.enableRotate = true; // 启用旋转
            controls.autoRotate = false; // 自动旋转
            controls.autoRotateSpeed = 1.0; // 旋转速度
            
            // 设置初始相机位置
            camera.position.set(60, 40, 60);
            camera.lookAt(0, 0, 0);
            
            // 创建光照
            setupLighting();
            
            // 射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // 事件监听
            setupEventListeners();
            
            // 加载中国地图数据
            loadChinaMap();
        }
        
        // 设置光照 - 增强版本
        function setupLighting() {
            // 环境光 - 提供基础亮度
            const ambientLight = new THREE.AmbientLight(0x1a3f6f, 0.6); // 蓝色环境光
            scene.add(ambientLight);
            
            // 主光源 - 模拟太阳光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(100, 120, 80);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 4096;
            directionalLight.shadow.mapSize.height = 4096;
            directionalLight.shadow.camera.near = 1;
            directionalLight.shadow.camera.far = 300;
            directionalLight.shadow.camera.left = -100;
            directionalLight.shadow.camera.right = 100;
            directionalLight.shadow.camera.top = 100;
            directionalLight.shadow.camera.bottom = -100;
            directionalLight.shadow.bias = -0.0001;
            scene.add(directionalLight);
            
            // 蓝色补光 - 模拟蓝色天空
            const blueLight = new THREE.DirectionalLight(0x4da6ff, 0.8);
            blueLight.position.set(-80, 60, -80);
            scene.add(blueLight);
            
            // 顶部蓝光 - 增强立体感
            const topLight = new THREE.DirectionalLight(0x6bb6ff, 0.6);
            topLight.position.set(0, 150, 0);
            scene.add(topLight);
            
            // 多个蓝色点光源 - 营造氛围
            const pointLight1 = new THREE.PointLight(0x00aaff, 1.2, 150);
            pointLight1.position.set(0, 40, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x0088cc, 0.8, 120);
            pointLight2.position.set(-50, 25, 50);
            scene.add(pointLight2);
            
            const pointLight3 = new THREE.PointLight(0x0066aa, 0.8, 120);
            pointLight3.position.set(50, 25, -50);
            scene.add(pointLight3);
            
            // 添加额外的蓝色点光源增强发光效果
            const pointLight4 = new THREE.PointLight(0x4da6ff, 0.6, 100);
            pointLight4.position.set(30, 20, 30);
            scene.add(pointLight4);
            
            const pointLight5 = new THREE.PointLight(0x6bb6ff, 0.6, 100);
            pointLight5.position.set(-30, 20, -30);
            scene.add(pointLight5);
        }
        
        // 事件监听设置
        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onMouseClick, false);
            renderer.domElement.addEventListener('mousemove', onMouseMove, false);
        }
        
        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 鼠标点击事件
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // 获取所有可交互的网格
            const allMeshes = [];
            provinces.forEach(province => {
                if (province instanceof THREE.Group) {
                    province.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            child.userData.parentProvince = province;
                            allMeshes.push(child);
                        }
                    });
                } else if (province instanceof THREE.Mesh) {
                    allMeshes.push(province);
                }
            });
            
            const intersects = raycaster.intersectObjects(allMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const clickedProvince = clickedMesh.userData.parentProvince || clickedMesh;
                onProvinceClick(clickedProvince);
            }
        }
        
        // 鼠标移动事件
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // 获取所有可交互的网格
            const allMeshes = [];
            provinces.forEach(province => {
                if (province instanceof THREE.Group) {
                    province.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            child.userData.parentProvince = province;
                            allMeshes.push(child);
                        }
                    });
                } else if (province instanceof THREE.Mesh) {
                    allMeshes.push(province);
                }
            });
            
            // 重置所有省份的高亮状态
            provinces.forEach(province => {
                if (province.userData.isHovered) {
                    province.userData.isHovered = false;
                    updateProvinceAppearance(province);
                    // 重置标签样式
                    if (province.userData.label) {
                        resetLabelStyle(province.userData.label);
                    }
                }
            });
            
            const intersects = raycaster.intersectObjects(allMeshes);
            
            // 高亮当前悬停的省份
            if (intersects.length > 0) {
                const hoveredMesh = intersects[0].object;
                const hoveredProvince = hoveredMesh.userData.parentProvince || hoveredMesh;
                hoveredProvince.userData.isHovered = true;
                updateProvinceAppearance(hoveredProvince);
                
                // 高亮标签
                if (hoveredProvince.userData.label) {
                    highlightLabel(hoveredProvince.userData.label);
                }
                
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }
        
        // 省份点击处理
        function onProvinceClick(province) {
            console.log('点击了省份:', province.userData.name);
            // 这里可以添加省份详情显示逻辑
            alert(`您点击了: ${province.userData.name || '未知省份'}`);
        }
        
        // 更新省份外观
        function updateProvinceAppearance(province) {
            const currentScheme = colorSchemes[colorSchemeIndex];
            
            // 递归处理组中的所有网格
            function updateMeshAppearance(mesh) {
                if (province.userData.isHovered) {
                    mesh.material.color.setHex(currentScheme.glow);
                    mesh.material.emissive.setHex(currentScheme.glow);
                    mesh.material.emissiveIntensity = 0.5; // 增加悬停发光强度
                    mesh.material.specular.setHex(0xffffff);
                } else {
                    mesh.material.color.setHex(currentScheme.primary);
                    mesh.material.emissive.setHex(currentScheme.emission);
                    mesh.material.emissiveIntensity = 0.3;
                    mesh.material.specular.setHex(currentScheme.glow);
                }
                // 保持贴图不变
                if (!mesh.material.map && chinaTexture) {
                    mesh.material.map = chinaTexture;
                    mesh.material.bumpMap = chinaTexture;
                    mesh.material.bumpScale = 0.1;
                    mesh.material.specularMap = chinaTexture;
                    mesh.material.needsUpdate = true;
                }
            }
            
            if (province instanceof THREE.Group) {
                // 如果是组，更新所有子网格
                province.children.forEach(child => {
                    if (child instanceof THREE.Mesh) {
                        updateMeshAppearance(child);
                    }
                });
            } else if (province instanceof THREE.Mesh) {
                // 如果是单个网格
                updateMeshAppearance(province);
            }
        }
        
        // 加载中国地图数据
        async function loadChinaMap() {
            try {
                showLoading(true);
                
                // 这里我们使用一个简化的中国地图JSON数据
                // 在实际项目中，您应该使用真实的GeoJSON数据
                const chinaData = await loadChinaGeoJSON();
                
                // 创建中国地图3D模型
                createChinaMap(chinaData);
                
                showLoading(false);
                showControls(true);
                
            } catch (error) {
                console.error('加载地图数据失败:', error);
                showLoading(false);
                alert('地图数据加载失败，请检查网络连接');
            }
        }
        
        // 获取中国GeoJSON数据
        async function loadChinaGeoJSON() {
             
                const response = await fetch('./data/china.json');
                if (!response.ok) {
                    throw new Error('Failed to load GeoJSON data');
                }
                return await response.json();
            
        }
        
        // 生成省份坐标（简化版）
        function generateProvinceCoordinates(center) {
            const [lon, lat] = center;
            const size = Math.random() * 2 + 1; // 随机大小
            const coords = [];
            
            // 生成一个简单的多边形
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const r = size + Math.random() * 0.5;
                coords.push([
                    lon + Math.cos(angle) * r,
                    lat + Math.sin(angle) * r
                ]);
            }
            coords.push(coords[0]); // 闭合多边形
            
            return [coords];
        }
        
        // 创建中国风纹理 - 更接近效果图的蓟色风格
        function createChinaTexture() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 1024;
            
            // 创建深蓝色渐变背景
            const gradient = context.createRadialGradient(512, 512, 0, 512, 512, 512);
            gradient.addColorStop(0, '#2a4f7f');
            gradient.addColorStop(0.3, '#1a3f6f');
            gradient.addColorStop(0.7, '#0a2f5f');
            gradient.addColorStop(1, '#001f4f');
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            // 添加发光效果纹理
            context.globalCompositeOperation = 'screen';
            
            // 创建多层发光效果
            for (let layer = 0; layer < 5; layer++) {
                const alpha = 0.1 - layer * 0.02;
                const size = 100 + layer * 50;
                
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    
                    const glowGradient = context.createRadialGradient(x, y, 0, x, y, size);
                    glowGradient.addColorStop(0, `rgba(0, 170, 255, ${alpha})`);
                    glowGradient.addColorStop(0.5, `rgba(0, 170, 255, ${alpha * 0.5})`);
                    glowGradient.addColorStop(1, 'rgba(0, 170, 255, 0)');
                    
                    context.fillStyle = glowGradient;
                    context.beginPath();
                    context.arc(x, y, size, 0, Math.PI * 2);
                    context.fill();
                }
            }
            
            // 添加细节纹理
            context.globalCompositeOperation = 'overlay';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const alpha = Math.random() * 0.3;
                
                context.fillStyle = `rgba(100, 200, 255, ${alpha})`;
                context.beginPath();
                context.arc(x, y, 1 + Math.random() * 2, 0, Math.PI * 2);
                context.fill();
            }
            
            // 创建纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1);
            texture.generateMipmaps = true;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            return texture;
        }
        
        // 创建中国地图3D模型
        function createChinaMap(geoData) {
            chinaGroup = new THREE.Group();
            
            geoData.features.forEach((feature, index) => {
                const province = createProvince(feature, index);
                if (province) {
                    chinaGroup.add(province);
                    provinces.push(province);
                }
            });
            
            // 计算地图边界框
            const box = new THREE.Box3().setFromObject(chinaGroup);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            // 居中并缩放到合适大小
            chinaGroup.position.x = -center.x;
            chinaGroup.position.z = -center.z;
            
            const maxSize = Math.max(size.x, size.z);
            const scale = 25 / maxSize;
            chinaGroup.scale.setScalar(scale);
            
            scene.add(chinaGroup);
            
            // 添加省份标签
            addProvinceLabels();
            
            // 添加地面效果
            addGroundEffect();
            
            // 添加粒子效果
            addParticleEffect();
        }
        
        // 创建单个省份
        function createProvince(feature, index) {
            try {
                const geometryType = feature.geometry.type;
                let coordinatesArray = [];
                
                // 处理不同的几何类型
                if (geometryType === 'Polygon') {
                    // 单个多边形
                    coordinatesArray = [feature.geometry.coordinates[0]];
                } else if (geometryType === 'MultiPolygon') {
                    // 多个多边形（如海南省的多个岛屿）
                    coordinatesArray = feature.geometry.coordinates.map(polygon => polygon[0]);
                } else {
                    console.warn('不支持的几何类型:', geometryType, feature.properties.name);
                    return null;
                }
                
                // 创建省份组，用于包含多个几何体
                const provinceGroup = new THREE.Group();
                
                // 为每个多边形创建几何体
                coordinatesArray.forEach((coordinates, polygonIndex) => {
                    if (!coordinates || coordinates.length < 3) {
                        console.warn('坐标数据不足:', feature.properties.name, polygonIndex);
                        return;
                    }
                    
                    // 转换坐标为Three.js坐标系
                    const points = coordinates.map(coord => {
                        // 经纬度转换为平面坐标
                        const x = (coord[0] - 104) * 1; // 以104东经为中心
                        const y = (coord[1] - 35) * 1;  // 以35北纬为中心
                        return new THREE.Vector2(x, y);
                    });
                    
                    // 创建形状
                    const shape = new THREE.Shape(points);
                    
                    // 创建拉伸几何体 - 增加高度和细节
                    const baseHeight = 1.2 + Math.random() * 0.8; // 增加基础高度
                    const extrudeSettings = {
                        depth: baseHeight,
                        bevelEnabled: true,
                        bevelThickness: 0.15, // 增加斜角厚度
                        bevelSize: 0.12, // 增加斜角大小
                        bevelOffset: 0,
                        bevelSegments: 4, // 增加斜角精度
                        steps: 2, // 增加拉伸段数
                        curveSegments: 16 // 增加曲线精度
                    };
                    
                    const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                    
                    // 计算几何体法向量和边界框
                    geometry.computeVertexNormals();
                    geometry.computeBoundingBox();
                    
                    // 创建材质（更接近效果图的蓝色风格）
                    const currentScheme = colorSchemes[colorSchemeIndex];
                    const material = new THREE.MeshPhongMaterial({
                        color: currentScheme.primary,
                        emissive: currentScheme.emission,
                        emissiveIntensity: 0.3, // 增加发光强度
                        shininess: 150, // 增加光泽度
                        transparent: true,
                        opacity: 0.9,
                        side: THREE.DoubleSide,
                        map: chinaTexture,
                        bumpMap: chinaTexture,
                        bumpScale: 0.1, // 增加凸起效果
                        specular: currentScheme.glow, // 添加镜面反射
                        specularMap: chinaTexture
                    });
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    // 添加边缘发光效果
                    addGlowEffectToMesh(mesh);
                    
                    // 将网格添加到省份组
                    provinceGroup.add(mesh);
                });
                
                // 如果没有成功创建任何几何体，返回null
                if (provinceGroup.children.length === 0) {
                    console.warn('无法为省份创建几何体:', feature.properties.name);
                    return null;
                }
                
                // 添加用户数据到组
                provinceGroup.userData = {
                    name: feature.properties.name,
                    isHovered: false,
                    originalHeight: 0.5, // 平均高度
                    center: feature.properties.center || feature.properties.cp || null, // 优先使用center，其次cp
                    geometryType: geometryType,
                    polygonCount: coordinatesArray.length
                };
                
                return provinceGroup;
                
            } catch (error) {
                console.error('创建省份失败:', feature.properties.name, error);
                return null;
            }
        }
        
        // 为单个网格添加发光效果 - 增强版本
        function addGlowEffectToMesh(mesh) {
            const currentScheme = colorSchemes[colorSchemeIndex];
            
            // 主边缘发光效果
            const edges = new THREE.EdgesGeometry(mesh.geometry, 30);
            const lineMaterial = new THREE.LineBasicMaterial({
                color: currentScheme.border,
                transparent: true,
                opacity: 1.0, // 增加不透明度
                linewidth: 5 // 增加线宽
            });
            
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.y = 0.002;
            mesh.add(wireframe);
            
            // 添加多层发光效果
            for (let i = 0; i < 3; i++) {
                const glowEdges = new THREE.EdgesGeometry(mesh.geometry, 20);
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: currentScheme.glow,
                    transparent: true,
                    opacity: 0.6 - i * 0.2,
                    linewidth: 3 - i
                });
                
                const glowWireframe = new THREE.LineSegments(glowEdges, glowMaterial);
                glowWireframe.position.y = 0.001 + i * 0.001;
                glowWireframe.scale.setScalar(1 + i * 0.01);
                mesh.add(glowWireframe);
            }
            
            // 添加光晕效果（使用Shader材质模拟）
            const glowGeometry = mesh.geometry.clone();
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: currentScheme.glow,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.scale.setScalar(1.05);
            mesh.add(glow);
            
            // 添加内部发光
            const innerGlowMaterial = new THREE.MeshBasicMaterial({
                color: currentScheme.emission,
                transparent: true,
                opacity: 0.1,
                side: THREE.FrontSide,
                blending: THREE.AdditiveBlending
            });
            
            const innerGlow = new THREE.Mesh(glowGeometry.clone(), innerGlowMaterial);
            innerGlow.scale.setScalar(0.98);
            mesh.add(innerGlow);
        }
        
        // 添加发光效果（兼容旧版本）
        function addGlowEffect(province) {
            // 如果是组，为每个子网格添加发光效果
            if (province instanceof THREE.Group) {
                province.children.forEach(child => {
                    if (child instanceof THREE.Mesh) {
                        addGlowEffectToMesh(child);
                    }
                });
            } else if (province instanceof THREE.Mesh) {
                // 单个网格
                addGlowEffectToMesh(province);
            }
        }
        
        // 添加省份标签
        function addProvinceLabels() {
            provinces.forEach(province => {
                if (province.userData.name) {
                    // 创建文字精灵
                    const sprite = createTextSprite(province.userData.name);
                    
                    // 获取省份在世界坐标系中的包围盒（已经应用了所有变换）
                    const box = new THREE.Box3().setFromObject(province);
                    const center = box.getCenter(new THREE.Vector3());
                    const topY = box.max.y;
                    
                    // 直接使用包围盒中心，这是最准确的位置
                    const labelX = center.x;
                    const labelZ = center.z;
                    
                    console.log(`${province.userData.name}: 标签位置 [${labelX.toFixed(2)}, ${labelZ.toFixed(2)}]`);
                    
                    // 设置标签位置在省份顶部上方
                    sprite.position.set(labelX, topY + 1.0, labelZ);
                    
                    // 将标签添加到场景而不是省份组，避免被省份变换影响
                    scene.add(sprite);
                    
                    // 保存标签引用到省份数据中
                    province.userData.label = sprite;
                    sprite.userData.provinceName = province.userData.name;
                    sprite.userData.isHighlighted = false;
                }
            });
        }
        
        // 高亮标签
        function highlightLabel(sprite) {
            if (!sprite || sprite.userData.isHighlighted) return;
            
            sprite.userData.isHighlighted = true;
            // 增大标签尺寸
            sprite.scale.multiplyScalar(1.3);
            
            // 更新标签材质以高亮显示
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const text = sprite.userData.provinceName;
            
            // 动态计算画布大小
            context.font = 'bold 32px Microsoft YaHei, Arial, sans-serif';
            const metrics = context.measureText(text);
            const textWidth = metrics.width;
            
            canvas.width = Math.max(textWidth + 50, 140);
            canvas.height = 60;
            
            // 重新设置字体
            context.font = 'bold 32px Microsoft YaHei, Arial, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // 高亮背景（金色发光效果）
            context.fillStyle = 'rgba(255, 215, 0, 0.9)';
            context.shadowColor = 'rgba(255, 215, 0, 0.8)';
            context.shadowBlur = 15;
            context.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
            context.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 12);
            context.fill();
            
            // 高亮边框
            context.strokeStyle = 'rgba(255, 255, 255, 1.0)';
            context.lineWidth = 3;
            context.stroke();
            
            // 绘制文字（黑色以便在金色背景上显示）
            context.shadowColor = 'rgba(0, 0, 0, 0.5)';
            context.shadowBlur = 2;
            context.fillStyle = '#000000';
            context.fillText(text, canvas.width/2, canvas.height/2);
            
            // 更新纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            sprite.material.map = texture;
            sprite.material.needsUpdate = true;
        }
        
        // 重置标签样式
        function resetLabelStyle(sprite) {
            if (!sprite || !sprite.userData.isHighlighted) return;
            
            sprite.userData.isHighlighted = false;
            // 恢复原始尺寸
            sprite.scale.divideScalar(1.3);
            
            // 恢复原始材质
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const text = sprite.userData.provinceName;
            
            // 动态计算画布大小
            context.font = 'bold 28px Microsoft YaHei, Arial, sans-serif';
            const metrics = context.measureText(text);
            const textWidth = metrics.width;
            
            canvas.width = Math.max(textWidth + 40, 120);
            canvas.height = 50;
            
            // 重新设置字体
            context.font = 'bold 28px Microsoft YaHei, Arial, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // 普通背景
            context.fillStyle = 'rgba(0, 0, 0, 0.7)';
            context.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
            context.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8);
            context.fill();
            
            // 普通边框
            context.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            context.lineWidth = 2;
            context.stroke();
            
            // 绘制文字（白色）
            context.shadowColor = 'rgba(0, 0, 0, 0.8)';
            context.shadowBlur = 3;
            context.shadowOffsetX = 1;
            context.shadowOffsetY = 1;
            context.fillStyle = '#ffffff';
            context.fillText(text, canvas.width/2, canvas.height/2);
            
            // 更新纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            sprite.material.map = texture;
            sprite.material.needsUpdate = true;
        }
        
        // 添加地面效果
        function addGroundEffect() {
            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x001133,
                transparent: true,
                opacity: 0.3,
                shininess: 100
            });
            
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 添加网格效果
            const gridHelper = new THREE.GridHelper(100, 50);
            gridHelper.material.color.setHex(0x004466);
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            gridHelper.position.y = -0.9;
            scene.add(gridHelper);
        }
        
        // 添加粒子效果
        function addParticleEffect() {
            const particleCount = 200;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // 位置
                positions[i3] = (Math.random() - 0.5) * 100;
                positions[i3 + 1] = Math.random() * 50;
                positions[i3 + 2] = (Math.random() - 0.5) * 100;
                
                // 颜色
                const color = new THREE.Color();
                color.setHSL(0.6 + Math.random() * 0.2, 0.8, 0.5);
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
                
                // 大小
                sizes[i] = Math.random() * 2 + 1;
            }
            
            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.5,
                transparent: true,
                opacity: 0.6,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            
            const particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
            
            // 移除粒子动画，保持静态粒子效果
        }
            
            // 添加粒子动画
        // 创建文字精灵 - 优化版本
        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // 动态计算画布大小
            context.font = 'bold 28px Microsoft YaHei, Arial, sans-serif';
            const metrics = context.measureText(text);
            const textWidth = metrics.width;
            
            canvas.width = Math.max(textWidth + 40, 120);
            canvas.height = 50;
            
            // 重新设置字体（canvas重置后需要重新设置）
            context.font = 'bold 28px Microsoft YaHei, Arial, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // 添加背景
            context.fillStyle = 'rgba(0, 0, 0, 0.7)';
            context.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
            context.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8);
            context.fill();
            
            // 添加边框
            context.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            context.lineWidth = 2;
            context.stroke();
            
            // 添加文字阴影
            context.shadowColor = 'rgba(0, 0, 0, 0.8)';
            context.shadowBlur = 3;
            context.shadowOffsetX = 1;
            context.shadowOffsetY = 1;
            
            // 绘制文字
            context.fillStyle = '#ffffff';
            context.fillText(text, canvas.width/2, canvas.height/2);
            
            // 创建纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            // 创建材质
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                alphaTest: 0.1,
                depthTest: false
            });
            
            // 创建精灵
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(canvas.width * 0.01, canvas.height * 0.01, 1);
            
            return sprite;
        }
           
        
        // 控制函数
        function resetCamera() {
            // 重置相机位置
            camera.position.set(60, 40, 60);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        
        // 切换动画模式
        function toggleAnimation() {
            isAnimating = !isAnimating;
            controls.autoRotate = isAnimating;
            
            if (isAnimating) {
                console.log('动画模式已开启');
            } else {
                console.log('动画模式已关闭');
            }
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            provinces.forEach(province => {
                function setWireframeMode(obj) {
                    if (obj instanceof THREE.Mesh) {
                        obj.material.wireframe = wireframeMode;
                    } else if (obj instanceof THREE.Group) {
                        obj.children.forEach(child => setWireframeMode(child));
                    }
                }
                setWireframeMode(province);
            });
        }
        
        function toggleLabels() {
            provinces.forEach(province => {
                if (province.userData.label) {
                    const label = province.userData.label;
                    label.visible = !label.visible;
                    
                    // 如果标签被隐藏，重置其高亮状态
                    if (!label.visible && label.userData.isHighlighted) {
                        resetLabelStyle(label);
                    }
                }
            });
        }
        
        function changeColorScheme() {
            colorSchemeIndex = (colorSchemeIndex + 1) % colorSchemes.length;
            updateAllProvincesColor();
        }
        
        function updateAllProvincesColor() {
            provinces.forEach(province => {
                updateProvinceAppearance(province);
                
                // 更新边缘发光颜色
                function updateWireframeColor(obj) {
                    obj.children.forEach(child => {
                        if (child instanceof THREE.LineSegments) {
                            const currentScheme = colorSchemes[colorSchemeIndex];
                            if (child.material.linewidth >= 4) {
                                child.material.color.setHex(currentScheme.border);
                            } else {
                                child.material.color.setHex(currentScheme.glow);
                            }
                        } else if (child instanceof THREE.Group) {
                            updateWireframeColor(child);
                        }
                    });
                }
                
                updateWireframeColor(province);
            });
        }
        
        // 切换贴图显示
        function toggleTexture() {
            const hasTexture = provinces.length > 0 && provinces[0].children.length > 0 && provinces[0].children[0].material.map;
            
            provinces.forEach(province => {
                function toggleMeshTexture(mesh) {
                    if (hasTexture) {
                        // 移除贴图
                        mesh.material.map = null;
                        mesh.material.bumpMap = null;
                    } else {
                        // 添加贴图
                        mesh.material.map = chinaTexture;
                        mesh.material.bumpMap = chinaTexture;
                        mesh.material.bumpScale = 0.05;
                    }
                    mesh.material.needsUpdate = true;
                }
                
                if (province instanceof THREE.Group) {
                    province.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            toggleMeshTexture(child);
                        }
                    });
                } else if (province instanceof THREE.Mesh) {
                    toggleMeshTexture(province);
                }
            });
        }
        
        // 重新生成纹理
        function regenerateTexture() {
            chinaTexture = createChinaTexture();
            
            // 更新所有使用该纹理的材质
            provinces.forEach(province => {
                function updateMeshTexture(mesh) {
                    if (mesh.material.map) {
                        mesh.material.map = chinaTexture;
                        mesh.material.bumpMap = chinaTexture;
                        mesh.material.needsUpdate = true;
                    }
                }
                
                if (province instanceof THREE.Group) {
                    province.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            updateMeshTexture(child);
                        }
                    });
                } else if (province instanceof THREE.Mesh) {
                    updateMeshTexture(province);
                }
            });
        }
        
        // 显示/隐藏加载界面
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('info').style.display = show ? 'none' : 'block';
        }
        
        function showControls(show) {
            document.getElementById('controls').style.display = show ? 'block' : 'none';
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新动画时间
            animationTime += 0.01;
            
            // 更新控制器（包含自动旋转）
            controls.update();
            
            // 动画效果（仅在动画模式下生效）
            if (isAnimating && chinaGroup) {
                // 省份高度动画
                provinces.forEach((province, index) => {
                    if (province.children && province.children.length > 0) {
                        const time = animationTime + index * 0.1;
                        const heightOffset = Math.sin(time) * 0.2;
                        province.position.y = heightOffset;
                        
                        // 轻微旋转效果
                        province.rotation.y = Math.sin(time * 0.5) * 0.02;
                    }
                });
                
                // 光源动画（使光源轻微移动）
                if (scene.children) {
                    scene.children.forEach(child => {
                        if (child instanceof THREE.PointLight) {
                            child.position.y += Math.sin(animationTime + child.position.x) * 0.02;
                        }
                    });
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // 启动应用
        window.addEventListener('DOMContentLoaded', () => {
            init();
            animate();
        });
    </script>
