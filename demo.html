<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国3D地图演示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a1a;
            font-family: 'Arial', sans-serif;
        }

        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            z-index: 100;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 50;
        }

        .controls button {
            background-color: #1e88e5;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .controls button:hover {
            background-color: #1565c0;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: #ffffff;
            z-index: 50;
            max-width: 250px;
        }

        .province-name {
            font-weight: bold;
            color: #42a5f5;
        }
    </style>
    <!-- Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/ExtrudeGeometry.js"></script>
</head>

<body>
    <div id="map-container"></div>
    <div id="loading">加载中...</div>
    <div class="controls">
        <button id="rotateToggle">自动旋转: 关闭</button>
        <button id="resetCamera">重置视角</button>
        <button id="colorScheme">切换配色</button>
    </div>
    <div class="info-panel">
        <h3>中国3D地图演示</h3>
        <p>使用Three.js实现的交互式中国地图</p>
        <p>悬停查看省份名称，点击查看详情</p>
        <p class="province-name" id="currentProvince">请选择一个省份</p>
    </div>

    <script>
        // 全局变量
        let scene, camera, renderer, controls, chinaGroup, raycaster, mouse;
        let isAutoRotating = false;
        let currentColorScheme = 0;
        let provinces = [];
        let currentProvince = null;

        // 颜色方案
        const colorSchemes = [
            { // 蓝色系
                main: 0x1a237e,
                hover: 0x3949ab,
                border: 0x42a5f5,
                text: 0xe3f2fd
            },
            { // 绿色系
                main: 0x1b5e20,
                hover: 0x2e7d32,
                border: 0x66bb6a,
                text: 0xe8f5e9
            },
            { // 红色系
                main: 0xb71c1c,
                hover: 0xc62828,
                border: 0xef5350,
                text: 0xffebef
            }
        ];

        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            // 创建相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 50);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('map-container').appendChild(renderer.domElement);

            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 0.5;

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 10, 7.5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-5, 10, -7.5);
            scene.add(directionalLight2);

            // 创建地面网格
            createGround();

            // 创建中国地图组
            chinaGroup = new THREE.Group();
            scene.add(chinaGroup);

            // 初始化射线投射器和鼠标向量
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 加载中国地图数据
            loadChinaMapData();

            // 添加事件监听
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);

            // 控制按钮事件
            document.getElementById('rotateToggle').addEventListener('click', toggleRotation);
            document.getElementById('resetCamera').addEventListener('click', resetCamera);
            document.getElementById('colorScheme').addEventListener('click', changeColorScheme);

            // 开始动画循环
            animate();
        }

        // 创建地面网格
        function createGround() {
            const gridHelper = new THREE.GridHelper(100, 20, 0x1e272e, 0x485460);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);
        }

        // 加载中国地图数据
        function loadChinaMapData() {
            fetch('data/china.json')
                .then(response => response.json())
                .then(data => {
                    processMapData(data);
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(error => {
                    console.error('加载地图数据失败:', error);
                    document.getElementById('loading').textContent = '加载失败，请刷新页面重试';
                });
        }

        // 处理地图数据并创建3D模型
        function processMapData(data) {
            // 地图数据边界计算
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            // 获取颜色方案
            const colors = colorSchemes[currentColorScheme];

            // 遍历每个省份
            data.features.forEach(feature => {
                const geometry = createProvinceGeometry(feature);

                if (geometry) {
                    // 计算边界
                    geometry.computeBoundingBox();
                    const box = geometry.boundingBox;
                    minX = Math.min(minX, box.min.x);
                    maxX = Math.max(maxX, box.max.x);
                    minY = Math.min(minY, box.min.z);
                    maxY = Math.max(maxY, box.max.z);

                    // 创建材质
                    const material = new THREE.MeshStandardMaterial({
                        color: colors.main,
                        transparent: true,
                        opacity: 0.8,
                        side: THREE.DoubleSide,
                        metalness: 0.2,
                        roughness: 0.8
                    });

                    // 创建省份网格
                    const provinceMesh = new THREE.Mesh(geometry, material);

                    // 计算省份中心位置用于标签
                    const center = new THREE.Vector3();
                    geometry.computeBoundingBox();
                    center.addVectors(geometry.boundingBox.min, geometry.boundingBox.max).multiplyScalar(0.5);

                    // 保存省份信息
                    provinceMesh.userData = {
                        name: feature.properties.name,
                        center: center.clone()
                    };

                    provinces.push(provinceMesh);
                    chinaGroup.add(provinceMesh);
                }
            });

            // 地图居中
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            chinaGroup.position.set(-centerX, 0, -centerY);

            // 调整地图大小
            const size = Math.max(maxX - minX, maxY - minY);
            const scale = 40 / size; // 缩放比例，使地图适合视口
            chinaGroup.scale.set(scale, scale, scale);
        }

        // 创建省份几何体
        function createProvinceGeometry(feature) {
            const coordinates = feature.geometry.coordinates;
            const shapes = [];

            // 处理不同的几何类型
            if (feature.geometry.type === 'Polygon') {
                processPolygon(coordinates, shapes);
            } else if (feature.geometry.type === 'MultiPolygon') {
                coordinates.forEach(polygon => {
                    processPolygon(polygon, shapes);
                });
            }

            if (shapes.length === 0) return null;

            // 创建挤出几何体
            const extrudeSettings = {
                depth: 0.5,
                bevelEnabled: false
            };

            // 创建挤出几何体
            const geometry = new THREE.ExtrudeGeometry(shapes, extrudeSettings);
            geometry.computeVertexNormals();

            return geometry;
        }

        // 处理多边形坐标并创建THREE.Shape
        function processPolygon(coordinates, shapes) {
            // 处理坐标数组
            const polygonCoords = coordinates[0]; // 第一个环是外环

            if (polygonCoords.length < 3) return; // 至少需要3个点来创建一个面

            const shape = new THREE.Shape();

            // 设置第一个点
            shape.moveTo(polygonCoords[0][0], polygonCoords[0][1]);

            // 添加其他点
            for (let i = 1; i < polygonCoords.length; i++) {
                shape.lineTo(polygonCoords[i][0], polygonCoords[i][1]);
            }

            shapes.push(shape);

            // 处理内部环（洞）
            for (let i = 1; i < coordinates.length; i++) {
                const hole = coordinates[i];
                if (hole.length < 3) continue;

                const holePath = new THREE.Path();
                holePath.moveTo(hole[0][0], hole[0][1]);

                for (let j = 1; j < hole.length; j++) {
                    holePath.lineTo(hole[j][0], hole[j][1]);
                }

                shape.holes.push(holePath);
            }
        }

        // 窗口大小变化处理
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 鼠标移动处理
        function onMouseMove(event) {
            // 计算鼠标在标准化设备坐标中的位置
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // 射线检测
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(provinces);

            // 重置所有省份的材质
            provinces.forEach(province => {
                const colors = colorSchemes[currentColorScheme];
                province.material.color.set(colors.main);
                province.scale.set(1, 1, 1);
            });

            // 如果有交点，高亮显示
            if (intersects.length > 0) {
                const province = intersects[0].object;
                const colors = colorSchemes[currentColorScheme];
                province.material.color.set(colors.hover);
                province.scale.set(1.02, 1.02, 1.02);

                // 更新当前选中的省份
                document.getElementById('currentProvince').textContent = `当前省份: ${province.userData.name}`;
                currentProvince = province;
            } else {
                document.getElementById('currentProvince').textContent = '请选择一个省份';
                currentProvince = null;
            }
        }

        // 鼠标点击处理
        function onMouseClick() {
            if (currentProvince) {
                alert(`您选择了: ${currentProvince.userData.name}`);
            }
        }

        // 切换自动旋转
        function toggleRotation() {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
            document.getElementById('rotateToggle').textContent = `自动旋转: ${isAutoRotating ? '开启' : '关闭'}`;
        }

        // 重置相机位置
        function resetCamera() {
            controls.reset();
            camera.position.set(0, 30, 50);
            camera.lookAt(0, 0, 0);
            isAutoRotating = false;
            controls.autoRotate = false;
            document.getElementById('rotateToggle').textContent = '自动旋转: 关闭';
        }

        // 切换颜色方案
        function changeColorScheme() {
            currentColorScheme = (currentColorScheme + 1) % colorSchemes.length;
            const colors = colorSchemes[currentColorScheme];

            provinces.forEach(province => {
                province.material.color.set(colors.main);
            });
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 更新控制器
            controls.update();

            // 渲染场景
            renderer.render(scene, camera);
        }

        // 当页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
